appId: com.nour.app
productName: Nour
copyright: "Gratuit et open source"

files:
  - "desktop/**/*"
  - "server/dist/**/*"
  - "client/dist/**/*"
  - "node_modules/**/*"
  - "package.json"

extraResources:
  - from: "server/dist"
    to: "server/dist"
  - from: "client/dist"
    to: "client/dist"

win:
  target:
    - portable
  icon: "../client/public/icon.svg"
  artifactName: "Nour-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

portable:
  artifactName: "Nour-${version}-portable.${ext}"

asar:
  smartUnpack: true

directories:
  output: "../dist-desktop"
  buildResources: "../client/public"