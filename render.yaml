services:
  - type: web
    name: nour
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      # Les outils TypeScript/Vite et leurs types sont nécessaires pendant le build Render.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
